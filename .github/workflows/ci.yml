name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3, system PyGObject)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-3.0 \
            gir1.2-notify-0.7 \
            gir1.2-ayatanaappindicator3-0.1 \
            dbus

      - name: Show versions
        run: |
          python3 --version
          python3 -c "import gi; print('PyGObject', gi.__version__)"

      - name: Run tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -v 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the tail of the failure as a public check annotation so
            # the failing test is visible without downloading logs.
            message=$(tail -n 80 test-output.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failure::${message}"
            exit "$status"
          fi
